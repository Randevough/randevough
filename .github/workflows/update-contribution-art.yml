name: Update contribution shooter

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_contribution_shooter.py"
      - ".github/workflows/update-contribution-art.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer
        run: python -m pip install --disable-pip-version-check Pillow==10.4.0

      - name: Generate animated contribution shooter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Randevough
        run: python scripts/generate_contribution_shooter.py

      - name: Commit updated animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-shooter.gif
          git diff --cached --quiet || git commit -m "chore: update contribution shooter"
          git push
